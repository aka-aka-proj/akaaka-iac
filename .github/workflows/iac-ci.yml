name: Supabase IaC CI - PR checks

on:
  pull_request:
    branches:
      - main
      - preview
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/ledger/**"
      - "supabase/functions/**"
      - "cloudflare/**"
      - ".github/workflows/iac-ci.yml"
      - ".github/workflows/web-push-delivery-scheduler.yml"
      - ".github/workflows/web-push-cleanup-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-checks:
    name: Verify ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: migrations
            path: supabase/migrations
          - name: functions
            path: supabase/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure target path exists
        run: |
          if [ ! -d "${{ matrix.target.path }}" ]; then
            echo "Missing required path: ${{ matrix.target.path }}"
            exit 1
          fi

      - name: Check migrations naming
        if: matrix.target.name == 'migrations'
        run: |
          invalid=0
          while IFS= read -r file; do
            base="$(basename "$file")"
            if ! echo "$base" | grep -Eq '^[0-9]{14}_.+\.sql$'; then
              echo "Invalid migration filename: $base"
              invalid=1
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql')
          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Supabase CLI
        if: matrix.target.name == 'migrations'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.111.0

      - name: Run local pgTAP contracts
        if: matrix.target.name == 'migrations'
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: |
          supabase db start
          while IFS= read -r -d '' test_file; do
            echo "Running $test_file"
            supabase test db --local "$test_file"
          done < <(find supabase/tests -type f -name '*.sql' -print0 | sort -z)

      - name: Stop local Supabase
        if: always() && matrix.target.name == 'migrations'
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: supabase stop --no-backup

      - name: Check privacy and search security contracts
        if: matrix.target.name == 'migrations'
        run: |
          privacy="supabase/migrations/20260810061600_admin_privacy_boundary.sql"
          search="supabase/migrations/20260811040000_server_side_event_search.sql"

          for required in \
            "CREATE POLICY profiles_read_self_admin" \
            "CREATE POLICY reports_read_owner" \
            "CREATE POLICY registrations_read_self_host" \
            "CREATE POLICY reg_responses_read_self_host" \
            "get_admin_report_queue" \
            "SECURITY DEFINER" \
            "REVOKE ALL ON FUNCTION public.get_admin_report_queue() FROM PUBLIC, anon, authenticated"; do
            if ! grep -Fq "$required" "$privacy"; then
              echo "Missing privacy migration contract: $required"
              exit 1
            fi
          done

          for forbidden in \
            "DROP POLICY IF EXISTS profiles_read_all" \
            "DROP POLICY IF EXISTS registrations_read_self_host_admin" \
            "DROP POLICY IF EXISTS reg_responses_read_self_host_admin" \
            "DROP POLICY IF EXISTS issues_update_admin" \
            "DROP POLICY IF EXISTS audit_logs_admin_read"; do
            if ! grep -Fq "$forbidden" "$privacy"; then
              echo "Missing explicit admin privacy removal guard: $forbidden"
              exit 1
            fi
          done

          for required in \
            "SECURITY INVOKER" \
            "REVOKE ALL ON FUNCTION public.search_events" \
            "GRANT EXECUTE ON FUNCTION public.search_events"; do
            if ! grep -Fq "$required" "$search"; then
              echo "Missing event search security contract: $required"
              exit 1
            fi
          done

          if grep -Fq "SECURITY DEFINER" "$search"; then
            echo "search_events must remain SECURITY INVOKER"
            exit 1
          fi

      - name: Check push subscription hygiene boundary
        if: matrix.target.name == 'migrations'
        run: |
          expand="supabase/migrations/20260826120000_push_subscription_hygiene.sql"

          for required in \
            "notification_push_deliveries_status_check" \
            "'cancelled'" \
            "GRANT SELECT, INSERT, UPDATE, DELETE ON public.push_subscriptions TO service_role" \
            "GRANT SELECT ON public.notifications TO service_role" \
            "endpoint_conflict" \
            "'endpoint_move_deferred'" \
            "'endpoint_moved'" \
            "'subscription_missing'" \
            "idx_notification_push_deliveries_subscription_sent" \
            "status IN ('pending', 'processing')" \
            "SECURITY DEFINER" \
            "SET search_path = public, extensions" \
            "GRANT EXECUTE ON FUNCTION public.subscribe_push_subscription(TEXT, TEXT, TEXT, TEXT) TO authenticated" \
            "GRANT EXECUTE ON FUNCTION public.cleanup_stale_push_subscriptions(INTEGER) TO service_role"; do
            if ! grep -Fq "$required" "$expand"; then
              echo "Missing expand hygiene contract: $required"
              exit 1
            fi
          done

          # Expand-only purity (api/004 §Rollout ordering step 1): no tightening
          # constraints or privilege revocations may ship in this migration; the
          # contract-step migration is a separate follow-up PR gated by weekly
          # release consumer evidence.
          if grep -Eq "push_subscriptions_endpoint_unique|REVOKE INSERT, UPDATE ON public.push_subscriptions|NOT VALID.*push_subscriptions" "$expand"; then
            echo "Expand-only hygiene migration contains a tightening change"
            exit 1
          fi

          for forbidden in pg_net http; do
            if grep -Fq "$forbidden" "$expand"; then
              echo "Forbidden external-network pattern in hygiene migrations: $forbidden"
              exit 1
            fi
          done

      - name: Check independent deletion ledger bootstrap boundary
        if: matrix.target.name == 'functions'
        run: |
          ledger="supabase/ledger/001_deletion_ledger_bootstrap.sql"
          for required in \
            "CREATE TABLE IF NOT EXISTS public.deletion_ledger_events" \
            "ENABLE ROW LEVEL SECURITY" \
            "REVOKE ALL ON TABLE public.deletion_ledger_events FROM PUBLIC, anon, authenticated" \
            "GRANT SELECT, INSERT, UPDATE ON TABLE public.deletion_ledger_events TO service_role" \
            "deletion_ledger_failed_requires_code" \
            "deletion_ledger_verified_requires_timestamp"; do
            if ! grep -Fq "$required" "$ledger"; then
              echo "Missing independent ledger contract: $required"
              exit 1
            fi
          done
          for forbidden in prompt completion plaintext ciphertext wrapped_key private_key provider_secret; do
            if grep -Eiq "^[[:space:]]+${forbidden}[[:space:]]" "$ledger"; then
              echo "Forbidden content-shaped ledger field: $forbidden"
              exit 1
            fi
          done

      - name: Check functions entrypoints
        if: matrix.target.name == 'functions'
        run: |
          missing=0
          while IFS= read -r dir; do
            if [ "$(basename "$dir")" = "_shared" ]; then
              continue
            fi
            if [ -f "$dir/index.ts" ] || [ -f "$dir/index.js" ]; then
              continue
            fi
            echo "Missing function entrypoint in $dir (expected index.ts or index.js)"
            missing=1
          done < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d)
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Deno
        if: matrix.target.name == 'functions'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Deno lint functions
        if: matrix.target.name == 'functions'
        run: deno lint --config supabase/functions/deno.json supabase/functions/

      - name: Type-check function entrypoints
        if: matrix.target.name == 'functions'
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Run Deno unit tests
        if: matrix.target.name == 'functions'
        run: deno test --allow-all --check supabase/functions/_shared/

      - name: Check external registration boundary
        if: matrix.target.name == 'functions'
        run: |
          registration="supabase/functions/create-registration/index.ts"
          for required in \
            "external_registration_url" \
            "external_registration" \
            "This event uses an external registration form"; do
            if ! grep -Fq "$required" "$registration"; then
              echo "Missing external registration contract: $required"
              exit 1
            fi
          done

      - name: Check stage deletion ledger control boundary
        if: matrix.target.name == 'functions'
        run: |
          control="supabase/functions/deletion-ledger-control/index.ts"
          for required in \
            "DELETION_LEDGER_CONTROL_MODE" \
            "DELETION_LEDGER_AUTH_TOKEN" \
            "ledger_service_not_configured" \
            "forbidden_admin_aal2_required" \
            "createCloudflareDeletionLedger" \
            "controlled_fixture"; do
            if ! grep -Fq "$required" "$control"; then
              echo "Missing stage deletion ledger control contract: $required"
              exit 1
            fi
          done
          for forbidden in \
            "SUPABASE_SERVICE_ROLE_KEY.*DELETION_LEDGER" \
            "DELETION_LEDGER_SERVICE_ROLE_KEY" \
            "console.log" \
            "response.text()" \
            "response.body"; do
            if grep -Eiq "$forbidden" "$control"; then
              echo "Forbidden deletion ledger control pattern: $forbidden"
              exit 1
            fi
          done

  # Deterministic contract gate（契約：001-vercel-deployment-spec.md「Weekly scheduled
  # production release」breaking-change gate clause (1) 與 docs-first binding bullet）：
  # 凡觸及 supabase/migrations/** 或 supabase/functions/** 的 PR，body 必須宣告
  # `Compatibility: backward-compatible | expand-only | contract-step`，check 對照 diff
  # 特徵交叉驗證（drop column/table/constraint/policy、REVOKE 等 RLS 收緊、SET NOT NULL、
  # Edge Function export 移除）；未宣告或不符即 fail——未宣告的 contract step 不得達 preview。
  # 同時強制 `Docs:` 宣告 required gate：被引用的 akaaka-docs PR 必須已合併進 docs main，
  # 使 backward-compatible／expand-only hotfix 也無法在權威文件未落地時進入 main。
  contract-gate:
    name: Compatibility & docs-first declaration gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    env:
      # 同 repo 的 body/files 讀取用 github.token 即可；AKA_REPO_TOKEN 僅在
      # 宣告引用 akaaka-docs PR 時（跨 repo 合併狀態驗證）才需要，缺漏時於
      # 步驟內顯式報錯而非讓所有 gh 呼叫以 exit 4 空白崩潰
      GH_TOKEN: ${{ secrets.AKA_REPO_TOKEN || github.token }}
      CROSS_REPO_TOKEN: ${{ secrets.AKA_REPO_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DOCS_REPO: aka-aka-proj/akaaka-docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cross-validate Compatibility and Docs declarations
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # 安全 gate 必須 fail-closed：無法取得 diff（權限／rate limit／暫時性錯誤）
          # 時不得視為「沒有契約變更」而放行
          body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')" \
            || { echo "::error::cannot read PR body; refusing to evaluate contract gate on unknown input"; exit 1; }
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate > /tmp/pr_files.json 2>/dev/null; then
            echo "::error::cannot fetch PR files; refusing to evaluate contract gate on unknown diff"
            exit 1
          fi
          jq -s 'flatten' /tmp/pr_files.json > /tmp/pr_files_flat.json

          touches=0
          while IFS= read -r f; do
            case "$f" in
              supabase/migrations/* | supabase/functions/*) touches=1; break ;;
            esac
          done < <(jq -r '.[].filename' /tmp/pr_files_flat.json)

          compat="$(printf '%s' "$body" | awk 'tolower($0) ~ /^compatibility:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/, ""); sub(/[[:space:]]+$/, ""); print; exit}')"
          docs_decl="$(printf '%s' "$body" | awk 'tolower($0) ~ /^docs:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}')"

          if [ "$touches" -eq 0 ]; then
            # 不觸及 Supabase 契約路徑：宣告非必填，但已宣告時仍驗格式
            if [ -n "$compat" ] && ! printf '%s' "$compat" | grep -Eq '^(backward-compatible|expand-only|contract-step)$'; then
              fail "Compatibility value '$compat' is not one of backward-compatible | expand-only | contract-step"
            fi
            echo "PR does not touch supabase contract paths; declaration gate satisfied."
            exit 0
          fi

          case "$compat" in
            backward-compatible|expand-only|contract-step) : ;;
            "") fail "PR touches supabase/migrations or supabase/functions but the body is missing the required declaration: 'Compatibility: backward-compatible | expand-only | contract-step'" ;;
            *) fail "Compatibility value '$compat' is not one of backward-compatible | expand-only | contract-step" ;;
          esac

          # Diff 交叉驗證：偵測破壞性特徵（migrations 新增行 vs functions 刪除的 export 行）。
          # 偵得破壞特徵而未宣告 contract-step 即 mismatch → fail；
          # 宣告 contract-step 但 diff 無可偵測特徵不擋（動態 SQL 等不可靜態偵測情境從寬）。
          detected=""
          mig_pat='(DROP[[:space:]]+(TABLE|COLUMN|CONSTRAINT|POLICY|FUNCTION|SCHEMA)|ALTER[[:space:]]+TABLE[^;]*DROP[[:space:]]+(COLUMN|CONSTRAINT)|REVOKE[[:space:]]|SET[[:space:]]+NOT[[:space:]]+NULL)'
          while IFS= read -r entry; do
            fname="${entry%%$'\t'*}"
            patch="$(jq -r --arg f "$fname" '[.[] | select(.filename == $f)][0].patch // ""' /tmp/pr_files_flat.json)"
            case "$fname" in
              supabase/migrations/*)
                # 三類新增行屬例行防護而非相容性破壞，偵測前先剝除：
                # 1) REVOKE ... ON FUNCTION ... FROM PUBLIC——函式 EXECUTE 權限
                #    硬化（歷來 migration 標準配管），不改變任何資料可及性；
                # 2) DROP ... IF EXISTS——冪等守衛式清理，目標物件本就可能
                #    不存在，不構成對既有保證的撤回。
                # 3) REVOKE ... ON <同一 patch 內以 CREATE TABLE IF NOT EXISTS
                #    新建的表>——新物件的 deny-by-default 權限配管（RLS matrix
                #    canonical DDL 的一部分）；物件此前不存在，撤銷不可能收回
                #    任何既有客戶端能力。殘餘風險：對既有表重複 CREATE IF NOT
                #    EXISTS 後同檔 REVOKE 也會被豁免——由 review 層把關，與本
                #    啟發式閘門「動態 SQL 從寬」的既有定位一致。
                plus_lines="$(printf '%s' "$patch" | grep '^+' || true)"
                contract_lines="$(printf '%s\n' "$plus_lines" \
                  | grep -Ev 'REVOKE[^;]*ON[[:space:]]+FUNCTION' \
                  | grep -Ev 'DROP[[:space:]]+(TABLE|COLUMN|CONSTRAINT|POLICY|FUNCTION|SCHEMA)[[:space:]]+IF[[:space:]]+EXISTS' \
                  || true)"
                created_objs="$(printf '%s\n' "$plus_lines" \
                  | sed -nE 's/^\+[[:space:]]*CREATE[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+NOT[[:space:]]+EXISTS[[:space:]]+)?([A-Za-z_][A-Za-z0-9_.]*).*/\2/p' \
                  | awk -F. '{print $NF}' | sort -u | tr '\n' '|' | sed 's/|$//')"
                if [ -n "$created_objs" ]; then
                  contract_lines="$(printf '%s\n' "$contract_lines" \
                    | grep -Eiv "REVOKE[^;]*ON[[:space:]]+(TABLE[[:space:]]+)?[A-Za-z0-9_.]*($created_objs)([[:space:];]|$)" \
                    || true)"
                fi
                hits="$(printf '%s\n' "$contract_lines" | grep -Ei "$mig_pat" || true)"
                if [ -n "$hits" ]; then detected="migrations:$fname"; fi
                ;;
              supabase/functions/*)
                dels="$(printf '%s' "$patch" | grep '^-.*export ' || true)"
                if [ -n "$dels" ]; then detected="functions-export-removed:$fname"; fi
                ;;
            esac
            [ -z "$detected" ] || break
          done < <(jq -r '.[] | [.filename] | @tsv' /tmp/pr_files_flat.json)

          if [ -n "$detected" ] && [ "$compat" != "contract-step" ]; then
            fail "Declaration mismatch: diff shows breaking change ($detected) but declared '$compat'. Declare 'Compatibility: contract-step' or fix the change."
          fi

          # Docs-first binding required gate：`Docs:` 必填；引用的 akaaka-docs PR 必須
          # 存在且已合併進 docs main（含 out-of-band hotfix 一律適用）
          if [ -z "$docs_decl" ]; then
            fail "PR body is missing the required 'Docs:' declaration ('Docs: none' or akaaka-docs PR numbers). Contract: docs-first binding in 001-vercel-deployment-spec.md."
          fi
          if [ "$(printf '%s' "$docs_decl" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" != "none" ]; then
            if [ -z "$CROSS_REPO_TOKEN" ]; then
              fail "AKA_REPO_TOKEN secret is required to validate akaaka-docs dependency merge state; set it or declare 'Docs: none' when no docs change is needed"
            fi
            for dnum in $(printf '%s' "$docs_decl" | tr ',' ' '); do
              case "$dnum" in ''|*[!0-9]*) fail "Docs reference '$dnum' is not an akaaka-docs PR number" ;; esac
              stamp="$(gh api "repos/$DOCS_REPO/pulls/$dnum" --jq '[(.state // ""),((.merged // false)|tostring),(.base.ref // "")] | @tsv' 2>/dev/null)" \
                || fail "Referenced akaaka-docs PR #$dnum does not exist"
              dst="$(printf '%s' "$stamp" | cut -f1)"; dmrg="$(printf '%s' "$stamp" | cut -f2)"; dbs="$(printf '%s' "$stamp" | cut -f3)"
              if [ "$dst" != "closed" ] || [ "$dmrg" != "true" ] || [ "$dbs" != "main" ]; then
                fail "Referenced akaaka-docs PR #$dnum is not merged into $DOCS_REPO main (state=$dst merged=$dmrg); authoritative documentation must land first"
              fi
            done
          fi

          echo "contract-gate passed (Compatibility=$compat; Docs=$docs_decl)"

  cloudflare-ledger-checks:
    name: Verify Cloudflare deletion ledger provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check provider boundary
        run: |
          worker="cloudflare/deletion-ledger-worker/src/index.ts"
          core="cloudflare/deletion-ledger-worker/src/ledger.ts"
          config="cloudflare/deletion-ledger-worker/wrangler.jsonc"
          for required in \
            "DurableObject" \
            "LEDGER_AUTH_TOKEN" \
            "LEDGER_MODE" \
            "idempotency_key" \
            "ledger_transition_conflict"; do
            if ! grep -Fq "$required" "$worker" "$core" "$config"; then
              echo "Missing Cloudflare ledger contract: $required"
              exit 1
            fi
          done
          for forbidden in console.log SUPABASE_SERVICE_ROLE_KEY DELETION_LEDGER_SERVICE_ROLE_KEY; do
            if grep -Fq "$forbidden" "$worker" "$core"; then
              echo "Forbidden Cloudflare ledger pattern: $forbidden"
              exit 1
            fi
          done

      - name: Validate Wrangler bundle without deployment
        run: npx --yes wrangler@4.123.0 deploy --dry-run
        working-directory: cloudflare/deletion-ledger-worker
