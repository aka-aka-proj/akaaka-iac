name: Auth Test Agent

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - verify-series-notification
          - verify-blocklist-conflict
          - verify-recurrence-behavior
          - verify-share-token
          - cleanup-run
      run_id:
        description: 'UUID run identity required only for cleanup-run'
        required: false
        type: string

concurrency:
  group: auth-test-agent-staging
  cancel-in-progress: false

env:
  SUPABASE_URL: https://xdknuxdhyvjgwlcliyqx.supabase.co

permissions:
  contents: read

jobs:
  auth-test:
    name: Verify staging fixtures
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/preview'
    environment: staging
    env:
      SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required secrets
        run: |
          [ -n "$SERVICE_ROLE_KEY" ] || { echo "Missing STAGING_SERVICE_ROLE_KEY — create it in repo Settings → Secrets → Actions"; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "Missing STAGING_ANON_KEY — create it in repo Settings → Secrets → Actions"; exit 1; }

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run agent command
        run: |
          echo "Source SHA: $GITHUB_SHA"
          deno check --config supabase/functions/deno.json supabase/functions/testing/authenticated-test-agent.ts
          deno run --allow-env --allow-net --config supabase/functions/deno.json \
            supabase/functions/testing/authenticated-test-agent.ts \
            "${{ github.event.inputs.command }}" \
            "${{ github.event.inputs.run_id }}"
