name: Auth Test Agent

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command'
        required: true
        default: 'list'
        type: choice
        options:
          - create
          - list
          - cleanup

concurrency:
  group: auth-test-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_URL: https://xdknuxdhyvjgwlcliyqx.supabase.co

jobs:
  auth-test:
    name: ${{ github.event.inputs.command == 'create' && 'Create test user' || github.event.inputs.command == 'cleanup' && 'Cleanup test users' || 'List test users' }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'
    environment: staging
    env:
      SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required secrets
        run: |
          [ -n "$SERVICE_ROLE_KEY" ] || { echo "Missing STAGING_SERVICE_ROLE_KEY — create it in repo Settings → Secrets → Actions"; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "Missing STAGING_ANON_KEY — create it in repo Settings → Secrets → Actions"; exit 1; }

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run agent command
        run: |
          deno run --allow-env --allow-net --config supabase/functions/deno.json \
            supabase/functions/testing/authenticated-test-agent.ts \
            "${{ github.event.inputs.command }}"

      - name: Cleanup on failure (safety net)
        if: failure() && github.event.inputs.command == 'create'
        run: |
          deno run --allow-env --allow-net --config supabase/functions/deno.json \
            supabase/functions/testing/authenticated-test-agent.ts cleanup || true
          echo "Safety cleanup completed (no-op if no accounts existed)"